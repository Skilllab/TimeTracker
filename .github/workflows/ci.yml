name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true

jobs:
  build-test:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ windows-latest, ubuntu-latest, macos-latest ]

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # SDK берётся из global.json
      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Restore local tools (husky)
        run: dotnet tool restore

      - name: Restore
        run: dotnet restore TimeTracker.slnx

      - name: Build
        run: dotnet build TimeTracker.slnx -c Release --no-restore

      - name: Test
        run: dotnet test TimeTracker.slnx -c Release --no-build --logger "trx;LogFileName=test-results.trx"

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results-${{ matrix.os }}
          path: '**/test-results.trx'
          if-no-files-found: ignore

  # Проверка форматирования. Отдельный job и не зависит от ОС, поэтому не дублируется в matrix
  format:
    name: format
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore TimeTracker.slnx

      # Упадет, если код не соответствует правилам в  .editorconfig
      - name: Format check
        run: dotnet format TimeTracker.slnx --verify-no-changes --no-restore