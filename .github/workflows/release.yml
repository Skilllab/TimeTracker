name: Release

on:
  push:
    tags: [ 'v*' ]
  workflow_dispatch:

permissions:
  contents: write

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  publish:
    name: publish ${{ matrix.rid }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            rid: win-x64
          - os: ubuntu-latest
            rid: linux-x64
          - os: macos-latest
            rid: osx-x64

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Restore local tools
        run: dotnet tool restore

      - name: Publish
        shell: pwsh
        run: |
          $proj = "src/TimeTracker.Desktop/TimeTracker.Desktop.csproj"
          if (Test-Path $proj) {
            dotnet publish $proj -c Release -r ${{ matrix.rid }} --self-contained false -o publish
          } else {
            Write-Host "App project not found yet (stage < 08) — creating placeholder artifact."
            New-Item -ItemType Directory -Force -Path publish | Out-Null
            Set-Content -Path publish/PLACEHOLDER.txt -Value "TimeTracker: app project not created yet (${{ matrix.rid }})"
          }

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: TimeTracker-${{ matrix.rid }}
          path: publish/**
          if-no-files-found: error